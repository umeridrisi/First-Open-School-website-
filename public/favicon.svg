<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Vibrant First Open School Sunshine Gradient -->
    <linearGradient id="fos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D" />
      <stop offset="42%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#E83A59" />
    </linearGradient>

    <!-- Golden Achievement & Learning Star Gradient -->
    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF58A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Smooth Gloss Glare -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Friendly Squircle App Icon Tile -->
  <rect width="512" height="512" rx="128" fill="url(#fos-bg)" />

  <!-- Subtle Inset Rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#FFFFFF" stroke-width="12" stroke-opacity="0.32" fill="none" />
  <path d="M16 128 C16 64 64 16 128 16 L384 16 C448 16 496 64 496 128 L496 160 C360 215 152 215 16 160 Z" fill="url(#glass-glare)" opacity="0.32" />

  <!-- 3D Pop Shadow Layer (Neo-brutalist tactile look matching the app UI) -->
  <g transform="translate(0, 16)" opacity="0.55">
    <path d="M 124 406
             C 124 422, 136 434, 152 434
             L 196 434
             C 212 434, 224 422, 224 406
             L 224 336
             L 326 336
             C 342 336, 354 324, 354 308
             L 354 272
             C 354 256, 342 244, 326 244
             L 224 244
             L 224 204
             L 374 204
             C 390 204, 402 192, 402 176
             L 402 140
             C 402 124, 390 112, 374 112
             L 152 112
             C 136 112, 124 124, 124 140
             Z" fill="#991B32" />
  </g>

  <!-- Ultra-Bold Crisp White Hero Letter "F" -->
  <path d="M 124 406
           C 124 422, 136 434, 152 434
           L 196 434
           C 212 434, 224 422, 224 406
           L 224 336
           L 326 336
           C 342 336, 354 324, 354 308
           L 354 272
           C 354 256, 342 244, 326 244
           L 224 244
           L 224 204
           L 374 204
           C 390 204, 402 192, 402 176
           L 402 140
           C 402 124, 390 112, 374 112
           L 152 112
           C 136 112, 124 124, 124 140
           Z" fill="#FFFFFF" />

  <!-- Playful Warm Sunrise Accent on the Upper Bar -->
  <path d="M 236 112 L 358 112 C 370 112 378 120 378 130 L 378 134 C 342 148 272 148 236 134 Z" fill="#FFD93D" opacity="0.95" />

  <!-- Soaring Golden Learning & Achievement Star -->
  <g transform="translate(392, 96)">
    <polygon points="0,-42 12,-12 44,-12 18,8 28,38 0,20 -28,38 -18,8 -44,-12 -12,-12"
             fill="url(#star-gold)"
             stroke="#B45309"
             stroke-width="4"
             stroke-linejoin="round" />
    <circle cx="-4" cy="-12" r="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Playful Education Sparkles -->
  <circle cx="104" cy="104" r="12" fill="#FFFFFF" opacity="0.8" />
  <circle cx="400" cy="408" r="14" fill="#FFE066" opacity="0.75" />
</svg>
